<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin Library</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
    .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 26px; height: 26px; }
    .top .grow { flex: 1; }
    .controls { display: flex; gap: 10px; align-items: center; margin: 20px 0 8px; flex-wrap: wrap; }
    #search { flex: 1; min-width: 220px; padding: 8px 12px; }
    .chips { display: flex; gap: 6px; }
    .chip {
      width: 22px; height: 22px; border-radius: 50%; padding: 0;
      background: var(--c); border: 2px solid transparent; opacity: .5;
    }
    .chip.on { opacity: 1; border-color: var(--text); }
    #summary { font-size: 13px; margin-bottom: 18px; }
    .page { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
    .page-head { display: flex; gap: 10px; align-items: baseline; }
    .page-head a { color: var(--text); font-weight: 600; font-size: 16px; text-decoration: none; word-break: break-word; }
    .page-head a:hover { text-decoration: underline; }
    .page-meta { font-size: 12px; margin: 2px 0 10px; }
    .hl { padding: 10px 0; border-top: 1px solid var(--border); }
    .hl:first-of-type { border-top: none; }
    .hl-actions { display: flex; gap: 4px; margin-top: 6px; font-size: 12px; }
    .hl-actions .date { margin-right: auto; padding: 2px 0; }
    .hl textarea { width: 100%; min-height: 70px; margin-top: 6px; resize: vertical; }
    mark.q { background: rgba(250, 204, 21, .5); color: inherit; border-radius: 2px; }
    .menu { position: relative; }
    .menu-list {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 210px;
      display: none; flex-direction: column; padding: 6px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.15);
    }
    .menu-list.open { display: flex; }
    .menu-list button { background: none; border: none; text-align: left; padding: 7px 10px; }
    .menu-list button:hover { background: var(--bg-soft); }
    @media (max-width: 600px) { .wrap { padding: 18px 16px 60px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1><img src="icons/128.png" alt="">Highlights</h1>
      <span class="grow"></span>
      <div class="menu">
        <button id="menuBtn">Export ▾</button>
        <div class="menu-list" id="menu">
          <button data-act="md">Download Markdown (shown results)</button>
          <button data-act="json">Back up everything (.json)</button>
          <button data-act="import">Restore from backup…</button>
        </div>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search highlights, notes, page titles…" autofocus>
      <div class="chips" id="chips"></div>
    </div>
    <div id="summary" class="muted"></div>
    <div id="pages"></div>
  </div>
  <script src="shared.js"></script>
  <script src="library.js"></script>
</body>
</html>
